apiVersion: v1
kind: Service
metadata:
  name: {{ include "rundeckpro.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rundeckpro.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
  selector:
    {{- include "rundeckpro.selectorLabels" . | nindent 4 }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 86400
