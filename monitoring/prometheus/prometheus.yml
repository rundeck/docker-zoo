global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Rundeck exposes JVM/HTTP/scheduler metrics natively (Rundeck 6+) at /monitoring/prometheus.
  # Job name is prefixed "rundeck-" so it matches the Rundeck Overview dashboard's instance filter.
  - job_name: 'rundeck-server'
    metrics_path: /monitoring/prometheus
    static_configs:
      - targets: ['rundeck:4440']
        labels:
          service: rundeck

  # Prometheus scraping itself (handy sanity check).
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
